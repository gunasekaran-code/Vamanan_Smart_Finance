name: frontend
description: >
  Vamanan Gold by Vamanan Enterprises V — SPA-style Flutter app with a persistent header/nav shell
  and role-based access control (SUPERADMIN, ADMIN, STAFF, CUSTOMER).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Auth talks to the PHP backend under api/auth/* over plain JSON POSTs,
  # and the signed-in AppUser is cached locally so a cold start can restore
  # the session without a round trip.
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # Drives the SPA-style nested/persistent routing: StatefulShellRoute
  # keeps the header + bottom nav mounted while only the active tab's
  # content swaps out, plus declarative redirect() for the RBAC guard.
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
